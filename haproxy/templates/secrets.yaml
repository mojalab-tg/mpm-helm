{{- if .Values.certificates.secrets.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "haproxy.fullname" . }}-secrets
  labels:
    {{- include "haproxy.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.certificates.secrets.ssl.certificate }}
  ssl-certificate: {{ .Values.certificates.secrets.ssl.certificate | b64enc }}
  {{- end }}
  {{- if .Values.certificates.secrets.ssl.privateKey }}
  ssl-private-key: {{ .Values.certificates.secrets.ssl.privateKey | b64enc }}
  {{- end }}
  {{- if .Values.certificates.secrets.ssl.caCertificate }}
  ssl-ca-certificate: {{ .Values.certificates.secrets.ssl.caCertificate | b64enc }}
  {{- end }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "haproxy.fullname" . }}-tls-bundle
  labels:
    {{- include "haproxy.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and .Values.certificates.secrets.ssl.certificate .Values.certificates.secrets.ssl.privateKey }}
  haproxy.pem: |
    {{ .Values.certificates.secrets.ssl.certificate }}
    {{ .Values.certificates.secrets.ssl.privateKey }}
  {{- end }}
  {{- if .Values.certificates.secrets.ssl.caCertificate }}
  ca.crt: {{ .Values.certificates.secrets.ssl.caCertificate | b64enc }}
  {{- end }}
{{- end }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "haproxy.fullname" . }}-stats
  labels:
    {{- include "haproxy.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.haproxy.stats.username | default "admin" | b64enc }}
  password: {{ .Values.haproxy.stats.password | default "admin123" | b64enc }}

---
# HAProxy Admin Credentials Secret
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "haproxy.fullname" . }}-admin
  labels:
    {{- include "haproxy.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.haproxy.admin.password | default "admin123" | b64enc }} 