# Default values for haproxy
# This is a YAML-formatted file optimized for microk8s and production use

replicaCount: 1

image:
  repository: haproxy
  tag: "2.8.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: LoadBalancer

  ports:
    http:
      port: 80
      targetPort: 8080
      protocol: TCP
    https:
      port: 443
      targetPort: 8443
      protocol: TCP
    # Additional TCP ports can be added here
    tcp-4000:
      port: 4000
      targetPort: 4000
      protocol: TCP
    tcp-4001:
      port: 4001
      targetPort: 4001
      protocol: TCP
    tcp-4002:
      port: 4002
      targetPort: 4002
      protocol: TCP

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# HAProxy Configuration Block
# This is the complete HAProxy configuration that will be used directly
# Optimized for microk8s with production-ready settings
haproxy:
  stats:
    enabled: true
    port: 8404
    username: "admin"
    password: "admin123"
  admin:
    password: "admin123"
  config: |
    # Global section optimized for microk8s and production
    global
      maxconn 10000
      log stdout format raw local0 info
      chroot /var/lib/haproxy
      stats socket /var/lib/haproxy/stats mode 600 level admin
      stats timeout 2m
      user haproxy
      group haproxy
      daemon
      ssl-default-bind-ciphers EECDH+AESGCM:EDH+AESGCM
      ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
      ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11 no-tls-tickets
      ssl-default-server-ciphers EECDH+AESGCM:EDH+AESGCM
      ssl-default-server-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
      ssl-default-server-options no-sslv3 no-tlsv10 no-tlsv11

    # Defaults section
    defaults
      log global
      mode http
      option httplog
      option dontlognull
      option http-server-close
      option forwardfor except 127.0.0.0/8
      option redispatch
      retries 3
      timeout http-request 10s
      timeout queue 1m
      timeout connect 10s
      timeout client 1m
      timeout server 1m
      timeout http-keep-alive 10s
      timeout check 10s
      maxconn 1000

    # HTTP Frontend - Redirect to HTTPS
    frontend http_frontend
      bind *:80
      mode http
      default_backend http_backend
      # HTTP to HTTPS redirect
      redirect scheme https code 301 if !{ ssl_fc }

    # HTTPS Frontend - Main Application UI
    frontend https_frontend
      {{- if .Values.certificates.certManager.enabled }}
      bind *:443 ssl crt /etc/ssl/certs/tls.crt /etc/ssl/certs/tls.key
      {{- else }}
      bind *:443 ssl crt /etc/ssl/certs/haproxy.pem
      {{- end }}
      mode http
      default_backend mpm_backend
      
      # Hostname-based routing for production domain
      acl is_mpm hdr(host) -i moov-portal.mojalab.gouv.tg
      acl is_vault hdr(host) -i moov-vault.mojalab.gouv.tg
      acl is_sdk hdr(host) -i moov-sdk.mojalab.gouv.tg
      acl is_mcc hdr(host) -i moov-mcc.mojalab.gouv.tg
      acl is_local hdr(host) -i haproxy.default.svc.cluster.local
      acl is_localhost hdr(host) -i localhost
      
      # Route to appropriate backend based on hostname
      use_backend mpm_backend if is_mpm
      use_backend vault_backend if is_vault
      use_backend sdk_backend if is_sdk
      use_backend mcc_backend if is_mcc
      use_backend mpm_backend if is_local is_localhost

    # TCP Frontend for SKD Adapter inbount
    frontend tcp_sdk_inbound_frontend
      bind *:4000
      mode tcp
      default_backend tcp_sdk_inbound_backend

    # TCP Frontend for SKD Adapter outbound
    frontend tcp_sdk_outbound_frontend
      bind *:4001
      mode tcp
      default_backend tcp_sdk_outbound_backend

    # TCP Frontend for SKD Adapter outbound
    frontend tcp_sdk_test_frontend
      bind *:4002
      mode tcp
      default_backend tcp_sdk_test_backend

    # Production Backend - Routes based on path
    backend mpm_backend
      mode http
      balance roundrobin
      option httpchk
      http-check expect status 200
      
      # Path-based routing for production domain
      acl is_experience_api path_beg /experience-api
      acl is_management_api path_beg /management-api
      acl is_auth path_beg /auth
      
      # Route to appropriate backend based on path
      use_backend mpm_experience_backend if is_experience_api
      use_backend mpm_management_backend if is_management_api
      use_backend auth_backend if is_auth
      use_backend mcm_backend

    # Vault Backend
    backend vault_backend
      mode http
      balance roundrobin
      option httpchk
      http-check expect status 200
      server vault1 pm4ml-vault-headless:8200 check maxconn 50

    # Frontend Backend
    backend mcm_backend
      mode http
      balance roundrobin
      option httpchk
      http-check expect status 200
      server frontend1 pm4ml-frontend:80 check maxconn 100
      server frontend2 pm4ml-frontend:80 check maxconn 100

    # Auth (Keycloack) Backend
    backend auth_backend
      mode http
      balance roundrobin
      option httpchk
      http-check expect status 200
      server keykloak1 pm4ml-keycloack:80 check maxconn 100

    # Experience API Backend
    backend mpm_experience_backend
      mode http
      balance roundrobin
      option httpchk
      http-check expect status 200
      # Path rewriting for experience API
      http-request set-path %[path,regsub(^/experience-api,)]
      server expapi1 pm4ml-experience-api:80 check maxconn 100

    # Management API Backend
    backend mpm_management_backend
      mode http
      balance roundrobin
      option httpchk
      http-check expect status 200
      # Path rewriting for management API
      http-request set-path %[path,regsub(^/management-api,)]
      server mgmtapi1 pm4ml-management-api:80 check maxconn 100

    # Mojaloop Core Connector Backend
    backend mcc_backend
      mode http
      balance roundrobin
      option httpchk
      http-check expect status 200
      server keykloak1  pm4ml-mojaloop-core-connector:3003 check maxconn 100

    # Production Backend - Routes based on path
    backend sim_backend
      mode http
      balance roundrobin
      option httpchk
      http-check expect status 200
      
      # Path-based routing for production domain
      acl is_experience_api path_beg /experience-api
      acl is_management_api path_beg /management-api
      acl is_auth path_beg /auth
      
      # Route to appropriate backend based on path
      use_backend mpm_experience_backend if is_experience_api
      use_backend mpm_management_backend if is_management_api
      use_backend auth_backend if is_auth
      use_backend mcm_backend

    # SDK adapter inbound Backend
    backend tcp_sdk_inbound_backend
      mode tcp
      balance roundrobin
      option tcp-check
      server redis1 pm4ml-sdk-scheme-adapter-api-svc:4000 check maxconn 100

    # SDK adapter inbound Backend
    backend tcp_sdk_outbound_backend
      mode tcp
      balance roundrobin
      option tcp-check
      server redis1 pm4ml-sdk-scheme-adapter-api-svc:4001 check maxconn 100

    # SDK adapter inbound Backend
    backend tcp_sdk_test_backend
      mode tcp
      balance roundrobin
      option tcp-check
      server redis1 pm4ml-sdk-scheme-adapter-api-svc:4002 check maxconn 100

    # HAProxy Stats Frontend
    frontend stats
      bind *:8404
      mode http
      stats uri /stats
      stats realm HAProxy\ Statistics
      stats auth admin:admin123
      stats refresh 10s
      stats enable

# Certificate management
certificates:
  # Enable cert-manager integration
  certManager:
    enabled: true  # Enabled by default for automatic certificate management
    # Certificate issuer
    issuer:
      name: "letsencrypt-prod"
      kind: "ClusterIssuer"
    # Certificate configuration
    certificate:
      name: "haproxy-tls"
      secretName: "haproxy-tls"
      dnsNames:
        - "haproxy.example.com"
        - "*.haproxy.example.com"
      duration: "2160h" # 90 days
      renewBefore: "360h" # 15 days

  # Enable Secrets configuration (alternative to cert-manager)
  secrets:
    enabled: false  # Disabled by default, enable for manual certificate management
    name: "haproxy-secrets"
    # SSL certificate and key (base64 encoded) - used when cert-manager is disabled
    ssl:
      certificate: ""
      privateKey: ""
      caCertificate: ""

# ConfigMap for additional HAProxy configuration
configMap:
  enabled: true
  name: "haproxy-config"
  # Additional configuration snippets
  additionalConfig: |
    # Custom ACLs

# Health check configuration
healthCheck:
  enabled: true
  path: "/health"
  port: 80
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

# Liveness probe
livenessProbe:
  enabled: true
  path: "/health"
  port: 80
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

# Readiness probe
readinessProbe:
  enabled: true
  path: "/health"
  port: 80
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Pod disruption budget
podDisruptionBudget:
  enabled: false  # Disabled for single-node microk8s, enable for production
  minAvailable: 1
  maxUnavailable: 1

# Horizontal Pod Autoscaler
hpa:
  enabled: false  # Disabled for microk8s, enable for production
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70

# Ingress configuration (if using ingress controller)
ingress:
  enabled: false  # Use LoadBalancer instead
  className: "nginx"
  annotations: {}
  hosts:
    - host: "haproxy.example.com"
      paths:
        - path: "/"
          pathType: "Prefix"
  tls:
    - secretName: "haproxy-tls"
      hosts:
        - "haproxy.example.com"

# Network policies
networkPolicy:
  enabled: false  # Disabled for microk8s, enable for production
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: "default"
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53

# Service monitor for Prometheus
serviceMonitor:
  enabled: false  # Disabled for microk8s, enable for production
  interval: "30s"
  scrapeTimeout: "10s"
  path: "/metrics"
  port: "metrics"

# Pod security context
podSecurityContext:
  fsGroup: 0
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0

# Container security context
securityContext:
  privileged: false
  allowPrivilegeEscalation: true
