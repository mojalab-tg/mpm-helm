---
# Headless service for StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kafka.fullname" . }}-headless
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
    service.type: headless
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: kafka
      port: {{ .Values.kafka.service.port }}
      targetPort: kafka
      protocol: TCP
    - name: controller
      port: 9093
      targetPort: controller
      protocol: TCP
  selector:
    {{- include "kafka.selectorLabels" . | nindent 4 }}

---
# Regular service for client connections
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kafka.fullname" . }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
    service.type: client
spec:
  type: {{ .Values.kafka.service.type }}
  ports:
    - name: kafka
      port: {{ .Values.kafka.service.port }}
      targetPort: {{ .Values.kafka.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "kafka.selectorLabels" . | nindent 4 }}