apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kafka.fullname" . }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "kafka.fullname" . }}-headless
  replicas: {{ .Values.kafka.replicaCount }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "kafka.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kafka.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: setup-node-id
          image: "{{ .Values.kafka.image.registry }}/{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          command:
            - /bin/bash
            - -c
            - |
              # Extract numeric node ID from pod name
              NODE_ID=${HOSTNAME##*-}
              echo "Setting up node ID: $NODE_ID"
              # Create env file that can be sourced
              echo "export KAFKA_CFG_NODE_ID=$NODE_ID" > /shared/node-env.sh
              echo "$NODE_ID" > /shared/node-id
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: shared-data
              mountPath: /shared
      containers:
        - name: kafka
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.kafka.image.registry }}/{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          imagePullPolicy: {{ .Values.kafka.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
              # Source the node ID
              source /shared/node-env.sh
              echo "Starting Kafka with Node ID: $KAFKA_CFG_NODE_ID"
              
              # Set POD_NAME for advertised listeners
              export POD_NAME=$(hostname)
              export KAFKA_CFG_ADVERTISED_LISTENERS="PLAINTEXT://${POD_NAME}.{{ include "kafka.fullname" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local:9092"
              
              echo "Advertised listeners: $KAFKA_CFG_ADVERTISED_LISTENERS"
              
              # Start Kafka
              exec /opt/bitnami/scripts/kafka/entrypoint.sh /opt/bitnami/scripts/kafka/run.sh
          ports:
            - name: kafka
              containerPort: 9092
              protocol: TCP
            - name: controller
              containerPort: 9093
              protocol: TCP
          env:
            # KRaft mode configuration
            - name: KAFKA_ENABLE_KRAFT
              value: "yes"
            - name: KAFKA_CFG_PROCESS_ROLES
              value: "controller,broker"
            - name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS
              value: {{ range $i := until (int .Values.kafka.replicaCount) }}{{ if $i }},{{ end }}{{ $i }}@{{ include "kafka.fullname" $ }}-{{ $i }}.{{ include "kafka.fullname" $ }}-headless.{{ $.Release.Namespace }}.svc.cluster.local:9093{{ end }}
            - name: KAFKA_KRAFT_CLUSTER_ID
              value: {{ include "kafka.clusterId" . }}
            
            # Pod-specific configuration - will be set by startup script
            # KAFKA_CFG_NODE_ID is set in the startup script after sourcing node-env.sh
            - name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CFG_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CFG_ADVERTISED_LISTENERS
              # This will be set dynamically in the startup script
              value: ""
            
            # Auto-create topics
            - name: KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE
              value: {{ .Values.kafka.autoCreateTopicsEnable | quote }}
            
            # Allow plaintext listener
            - name: ALLOW_PLAINTEXT_LISTENER
              value: "yes"
            
            # Data directory
            - name: KAFKA_CFG_LOG_DIRS
              value: "/bitnami/kafka/data"
            
            # Pod name for advertised listeners - now handled in startup script
            # POD_NAME is set dynamically in the startup script
          
          volumeMounts:
            - name: data
              mountPath: /bitnami/kafka/data
            - name: shared-data
              mountPath: /shared
          
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
          
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || \
                  netstat -ln | grep :9092
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  kafka-broker-api-versions.sh --bootstrap-server localhost:9092 | grep -q "ApiVersion" || \
                  (netstat -ln | grep :9092 && kafka-log-dirs.sh --bootstrap-server localhost:9092 --describe --json | grep -q "logDirs")
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
      
      {{- with .Values.kafka.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kafka.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kafka.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: shared-data
          emptyDir: {}
  
  {{- if .Values.kafka.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- range .Values.kafka.persistence.accessModes }}
          - {{ . | quote }}
          {{- end }}
        resources:
          requests:
            storage: {{ .Values.kafka.persistence.size | quote }}
        {{- if .Values.kafka.persistence.storageClass }}
        storageClassName: {{ .Values.kafka.persistence.storageClass | quote }}
        {{- end }}
  {{- else }}
      volumes:
        - name: data
          emptyDir: {}
  {{- end }}